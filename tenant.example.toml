# 一家企業的設定。複製成 tenant.toml（或用環境變數 TENANT_CONFIG 指定路徑）。
# 換一家公司只改這個檔，不改程式。檢查：python -m src.worker check-tenant
# 每個「訪談 Qn」標記對應 brain/outputs/reports/2026-11-11-interview-questions.md 的題號；
# 完整對照見 docs/INTERVIEW_TO_CONFIG.md。

name = "示範公司"

# 助理開放到哪個階段（訪談 Q17）：1 只讀｜2 擬稿｜3 改檔（逐次確認）｜4 寄信（逐次確認）
stage = 1

# 一律不收的資料（訪談 Q10「絕對不能讓 AI 碰」）。glob 比對路徑：
#   gdrive/<資料夾路徑>/<檔名>、fileshare/<連接器 name>/<相對路徑>
exclude = [
  "fileshare/nas/人資/薪資/*",
  "*.key",
]

# 資料來源（訪談 Q7、Q8）。沒有這一段時依 .env 的 GITHUB_REPO／GDRIVE_FOLDER_IDS。
[[connectors]]
type = "gdrive"
folder_ids = ["<Google Drive 資料夾 ID>"]

[[connectors]]
type = "fileshare"           # 公司共用資料夾／NAS，先掛載到同步程式所在的機器
name = "nas"
root = "/mnt/nas/公司文件"
max_files = 2000

# [[connectors]]
# type = "m365"              # Microsoft 365：尚未實作，訪談確認後做

[permissions]
# 沒有任何規則命中時誰能看（訪談 Q9）
default = ["domain:example.com"]
# true：Google Drive 等來源有分享資訊時直接沿用（飛書、Grok 的做法）
inherit_source_permissions = true
# 員工能不能看到「有 N 筆相關資料你沒權限看」（預設只給管理員在週報看）
reveal_denied_count_to_users = false

# 由上往下，第一條命中的規則生效（NAS 沒有可沿用的權限，靠這裡對應部門）
[[permissions.rules]]
match = "fileshare/nas/人資/*"
allow = ["group:人資"]

[[permissions.rules]]
match = "fileshare/nas/業務/*"
allow = ["group:業務部", "boss@example.com"]

# 群組成員（之後可改成從 Google／Microsoft 目錄同步）
[groups]
"人資" = ["hr@example.com"]
"業務部" = ["amy@example.com", "bob@example.com"]

# 操作紀錄保存天數（訪談 Q19；飛書 aily 預設 180 天）
[audit]
retention_days = 180
